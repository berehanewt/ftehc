# Local-only diagnostics for easier troubleshooting
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Local dev often runs without MailHog; keep health UP when SMTP is unavailable
management.health.mail.enabled=false

# When the Angular app is running separately in local dev, let backend SPA routes
# redirect there instead of 404ing when index.html is not bundled into Spring Boot.
app.frontend.dev-url=http://localhost:4200

