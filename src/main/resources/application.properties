spring.application.name=ftehc

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/school_portal

# JWT
app.jwt.secret=CHANGE_THIS_TO_A_VERY_LONG_SECRET_KEY_AT_LEAST_256_BITS_FOR_HS256
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Password Reset Token TTL (ms) - 1 hour
app.password-reset.expiration-ms=3600000

# Mail (MailHog for dev)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@schoolportal.local

# Storage
app.storage.type=local
app.storage.local.upload-dir=./uploads

# Actuator
management.endpoints.web.exposure.include=health,info

# Keep default/dev health UP when SMTP is not running.
# application-prod.properties explicitly re-enables this check.
management.health.mail.enabled=false

